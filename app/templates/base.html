<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UsChat Secure</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#075e54">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="UsChat Secure">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ece5dd;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #075e54;
            color: white;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .content {
            padding: 16px;
            flex: 1;
        }

        h1, h2 {
            text-align: center;
            color: #075e54;
            margin-top: 0;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #128c7e;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0f7a6d;
        }

        a {
            color: #128c7e;
            text-decoration: none;
        }

        p {
            text-align: center;
        }

        .flash {
            background: #e7f3ff;
            color: #075e54;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .user-card {
            background: #f7f7f7;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 12px;
            background: #efeae2;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
        }

        .message-row {
            display: flex;
            margin-bottom: 12px;
        }

        .message-row.me {
            justify-content: flex-end;
        }

        .message-row.other {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 78%;
            padding: 10px 12px;
            border-radius: 12px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .message-row.me .message-bubble {
            background: #dcf8c6;
            text-align: left;
        }

        .message-row.other .message-bubble {
            background: white;
            text-align: left;
        }

        .message-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #075e54;
        }

        .message-time {
            font-size: 11px;
            margin-top: 6px;
            color: #666;
            text-align: right;
        }

        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .small-link {
            display: inline-block;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .content {
                padding: 12px;
            }

            .chat-box {
                height: 360px;
            }

            .message-bubble {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">UsChat Secure</div>

        <div class="content">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
                    .then(function (registration) {
                        console.log("Service Worker registriert:", registration.scope);
                    })
                    .catch(function (error) {
                        console.log("Service Worker Fehler:", error);
                    });
            });
        }
    </script>
</body>
</html>
