<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Deine App</title>
</head>
<body>

    <!-- Flash Nachrichten -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: 
                    {% if category == 'danger' %}red
                    {% elif category == 'success' %}green
                    {% else %}black{% endif %};">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Inhalt -->
    {% block content %}{% endblock %}

</body>
</html>
