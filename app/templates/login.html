{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

<form method="POST">
    <input type="email" name="email" placeholder="E-Mail" required>
    <input type="password" name="password" placeholder="Passwort" required>
    <button type="submit">Einloggen</button>
</form>

<p>Noch kein Konto? <a href="{{ url_for('auth.register') }}">Registrieren</a></p>
<p><a href="{{ url_for('auth.forgot_password') }}">Passwort vergessen?</a></p>
{% endblock %}
