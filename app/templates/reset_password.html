{% extends "base.html" %}

{% block content %}
<h1>Neues Passwort</h1>

<form method="POST">
    <input type="text" name="code" placeholder="6-stelliger Code" required>
    <input type="password" name="password" placeholder="Neues Passwort" required>
    <input type="password" name="confirm_password" placeholder="Passwort wiederholen" required>
    <button type="submit">Passwort speichern</button>
</form>

<p><a href="{{ url_for('auth.login') }}">Zurück zum Login</a></p>
{% endblock %}
